  <dialog class="fd-dialog" id="fd-dialog" aria-labelledby="fd-dialog-title"><h2 id="fd-dialog-title"></h2><div id="fd-dialog-content"></div><div class="fd-dialog-actions"><button type="button" class="fd-button" data-close-dialog>Keep it</button><button type="button" class="fd-button fd-button-primary" id="fd-dialog-confirm">Confirm</button></div></dialog>
  <script>
  (() => {
    const root=document.getElementById('f1-visual-review');
    const stage=root.querySelector('#fd-layout-stage');
    const app=root.querySelector('#fd-app');
    const hero=root.querySelector('#fd-hero-source').src;
    const thumb=root.querySelector('#fd-thumb-source').src;
    const photos=['sao','singapore','bahrain'].map(id=>root.querySelector('#fd-photo-'+id).src);
    const screens=[['browse','Browse'],['weekend','Race weekend'],['queue','Queue'],['downloads','Downloads'],['watch','Watch'],['settings','Settings']];
    const rounds=[{id:'sao',name:'São Paulo',circuit:'Interlagos · Brazil',date:'6–8 Nov',round:20,ready:true},{id:'mex',name:'Mexico City',circuit:'Autódromo Hermanos Rodríguez',date:'30 Oct–1 Nov',round:19,ready:true},{id:'austin',name:'Austin',circuit:'Circuit of the Americas · USA',date:'23–25 Oct',round:18,ready:true},{id:'vegas',name:'Las Vegas',circuit:'Las Vegas Strip · USA',date:'19–21 Nov',round:21,ready:false},{id:'qatar',name:'Lusail',circuit:'Lusail International · Qatar',date:'27–29 Nov',round:22,ready:false},{id:'abudhabi',name:'Abu Dhabi',circuit:'Yas Marina · UAE',date:'4–6 Dec',round:23,ready:false}];
    const sessions=[{id:'race',name:'Grand Prix',type:'Race',duration:'2h 14m',date:'Sunday · 8 Nov'},{id:'qual',name:'Qualifying',type:'Qualifying',duration:'1h 19m',date:'Saturday · 7 Nov'},{id:'p3',name:'Practice 3',type:'Practice',duration:'1h 39m',date:'Saturday · 7 Nov'},{id:'p2',name:'Practice 2',type:'Practice',duration:'1h 38m',date:'Friday · 6 Nov'},{id:'p1',name:'Practice 1',type:'Practice',duration:'1h 41m',date:'Friday · 6 Nov'}];
    const exampleLibrary=()=>[{id:'race',name:'São Paulo Grand Prix',type:'Race',weekend:'São Paulo',duration:'2h 14m',size:'3.1 GB',season:'2026'},{id:'sgqual',name:'Singapore qualifying',type:'Qualifying',weekend:'Singapore',duration:'1h 19m',size:'1.9 GB',season:'2026'},{id:'bahrain',name:'Bahrain Grand Prix',type:'Race',weekend:'Bahrain',duration:'3h 52m',size:'5.4 GB',season:'2026'}];
    const exampleQueue=()=>[{id:'p2',name:'São Paulo · Practice 2',status:'running'},{id:'p3',name:'São Paulo · Practice 3',status:'queued'},{id:'sg-race',name:'Singapore · Grand Prix',status:'failed'}];
    const state={screen:'browse',device:'desktop',mode:'populated',round:'sao',season:'2026',availability:'all',search:'',sessionType:'All',librarySearch:'',jobs:exampleQueue(),library:exampleLibrary(),paused:false,editingAccount:false,playing:false,toast:''};

    let dialogAction=null;
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const photo=(className='',position='center',index=0)=>`<img class="fd-photo ${className}" src="${photos[index%photos.length]||thumb}" alt="Formula 1 race imagery" style="object-position:${position}">`;

    const activeJobs=()=>state.jobs.filter(j=>j.status==='queued'||j.status==='running');
    const storageReady=()=>!['storage','offline'].includes(state.mode);
    const accountReady=()=>state.mode!=='account';
    function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{visualLanguage:'Broadcast graphite',layoutApproved:true,screen:state.screen,device:state.device,appearance:prefs.appearance,photoTreatment:prefs.photoTreatment,cornerStyle:prefs.cornerStyle},privateContent:{stylePreview:true,screen:state.screen,device:state.device,mode:state.mode,appearance:prefs.appearance,photoTreatment:prefs.photoTreatment,cornerStyle:prefs.cornerStyle}}).catch(()=>{});}
    function empty(title,copy,action='browse',label='Browse replays',symbol='inbox'){return `<div class="fd-empty">${icon(symbol)}<h2>${title}</h2><p>${copy}</p>${button(label,action,true)}</div>`;}
    function nav(mobile=false){return [['browse','Browse','compass'],['queue','Queue','list-ordered'],['downloads','Downloads','download'],['settings','Settings','settings']].map(([id,label,symbol])=>{const active=state.screen===id||(id==='browse'&&state.screen==='weekend')||(id==='downloads'&&state.screen==='watch');return `<button type="button" data-go="${id}" ${active?'aria-current="page"':''}>${mobile?icon(symbol):''}<span>${label}${id==='queue'&&activeJobs().length?`<b class="fd-nav-count">${activeJobs().length}</b>`:''}</span></button>`;}).join('');}
    function notice(){if(state.mode==='storage')return `<div class="fd-notice fd-app-notice"><span>${icon('hard-drive')} Media storage is unavailable. Downloads are waiting.</span><button class="fd-button fd-button-quiet" data-go="settings">View storage</button></div>`;if(state.mode==='offline')return `<div class="fd-notice fd-app-notice"><span>Connection lost. Reconnecting…</span><span class="fd-small">Your queue is saved.</span></div>`;if(!accountReady()&&state.screen!=='settings')return `<div class="fd-notice fd-app-notice"><span>Connect your F1TV account to download replays.</span><button class="fd-button fd-button-quiet" data-go="settings">Connect account</button></div>`;return '';}
    function pageTitle(title,subtitle='',action=''){return `<div class="fd-page-title"><div><h1>${title}</h1>${subtitle?`<p class="fd-muted fd-small" style="margin-top:6px">${subtitle}</p>`:''}</div>${action}</div>`;}
    function heroBlock(round,withAction=true){return `<div class="fd-hero"><img class="fd-photo" src="${hero}" alt="Formula 1 race replay"><div class="fd-hero-copy"><span class="fd-eyebrow">${withAction?'Latest available replay':`Round ${round.round} · ${state.season}`}</span><${withAction?'h2':'h1'}>${round.name} Grand Prix</${withAction?'h2':'h1'}><div class="fd-hero-meta">${round.circuit}${withAction?' · 5 sessions available':` · ${round.date}`}</div>${withAction?button('Browse weekend '+icon('arrow-right'),'latest',true):`<div class="fd-policy" style="color:#fff">720p <span>·</span> English <span>·</span> F1 LIVE</div>`}</div></div>`;}
    function browse(){const list=rounds.filter(r=>(state.availability==='all'||(state.availability==='ready'&&r.ready)||(state.availability==='upcoming'&&!r.ready))&&`${r.name} ${r.circuit}`.toLowerCase().includes(state.search.toLowerCase()));return `${pageTitle('Browse replays','Formula 1 race weekends, season by season.',button(icon('refresh-cw')+' Refresh','refresh'))}${heroBlock(rounds[0])}<div class="fd-toolbar"><select class="fd-select" aria-label="Browse season" data-field="season" style="width:130px">${['2026','2025','2024','2012'].map(y=>`<option ${state.season===y?'selected':''}>${y}</option>`).join('')}</select><select class="fd-select" aria-label="Replay availability" data-field="availability" style="width:175px"><option value="all" ${state.availability==='all'?'selected':''}>All weekends</option><option value="ready" ${state.availability==='ready'?'selected':''}>Replays available</option><option value="upcoming" ${state.availability==='upcoming'?'selected':''}>Upcoming</option></select><label class="fd-search">${icon('search')}<input class="fd-input" id="fd-browse-search" type="search" placeholder="Search city or circuit" aria-label="Search city or circuit" value="${escape(state.search)}" data-search="browse"></label></div><div class="fd-section-head"><h2>${state.season} season</h2><span class="fd-muted fd-small">${list.length} weekends shown</span></div><div class="fd-weekends">${list.map((r,i)=>`<button type="button" class="fd-event" data-round="${r.id}" aria-label="View ${r.name} race weekend"><div class="fd-event-image">${photo('',i%2?'right center':'center',i)}<span class="fd-round">ROUND ${r.round}</span></div><div class="fd-event-info"><h3>${r.name}</h3><p class="fd-small fd-muted">${r.circuit}</p><div class="fd-event-bottom"><span class="fd-badge ${r.ready?'fd-good':''}">${r.ready?'Replays available':'Upcoming'}</span><span>${r.date}</span></div></div></button>`).join('')}</div>${!list.length?empty('No matching weekends','Try another city or circuit.','clear-search','Clear search','search'):''}`;}
    function weekend(){const round=rounds.find(r=>r.id===state.round)||rounds[0];const list=sessions.filter(s=>state.sessionType==='All'||s.type===state.sessionType);const breadcrumbs=`<div class="fd-breadcrumb"><button data-go="browse">Browse</button><span>/ ${state.season} / ${round.name}</span></div>`;if(!round.ready)return `${breadcrumbs}${heroBlock(round,false)}${empty('Replays are not available yet','You can return to this weekend after the sessions finish.','browse','Browse available replays','calendar-days')}`;return `${breadcrumbs}${heroBlock(round,false)}<div class="fd-section-head"><h2>Weekend sessions</h2><span class="fd-small fd-muted">Newest first</span></div><div class="fd-chips" style="margin-bottom:16px">${['All','Race','Qualifying','Practice','Sprint'].map(t=>`<button type="button" class="fd-chip" aria-pressed="${state.sessionType===t}" data-session-type="${t}">${t}</button>`).join('')}</div>${state.mode==='feed'?`<div class="fd-notice"><span>F1 LIVE with English audio is not available for these sessions.</span></div>`:''}<div class="fd-session-grid">${list.map((s,i)=>{const downloaded=state.library.some(x=>x.id===s.id)&&round.id==='sao';const queued=state.jobs.some(j=>j.id===s.id&&['queued','running'].includes(j.status));const available=state.mode!=='feed';const action=downloaded?'watch':!accountReady()?'settings':`queue:${s.id}`;const label=downloaded?'Watch':!available?'Feed unavailable':queued?'Queued':!accountReady()?'Connect account':'Add to queue';return `<article class="fd-session"><div class="fd-thumb">${photo('',i%2?'right center':'left center',i+1)}<span class="fd-thumb-label">${s.duration}</span></div><div class="fd-card-body"><span class="fd-eyebrow fd-muted">${s.type}</span><h3>${s.name}</h3><p class="fd-small fd-muted">${s.date}</p><div class="fd-card-footer"><span class="fd-small ${downloaded?'fd-good':'fd-muted'}">${downloaded?'Downloaded':'720p · English'}</span>${button(label,action,!queued,((!available&&!downloaded)||queued||(!storageReady()&&accountReady()))?'disabled':'')}</div></div></article>`;}).join('')}</div>${!list.length?empty('No sprint sessions this weekend','The available practices, qualifying and race are listed under All.','all-sessions','Show all sessions','flag'):''}`;}
    function queue(){if(!state.jobs.length)return `${pageTitle('Queue','Downloads run one at a time.')}${empty('Your queue is clear','Choose a replay and it will appear here.','browse','Browse race weekends','list-ordered')}`;const current=state.jobs.find(j=>j.status==='running');const waiting=state.jobs.filter(j=>j.status==='queued');const failed=state.jobs.filter(j=>j.status==='failed');return `${pageTitle('Queue',`${activeJobs().length} active or waiting · ${failed.length} needs attention`,button(state.paused?'Resume queue':'Pause queue','pause',false,state.mode==='offline'?'disabled':''))}${current?`<article class="fd-active-job"><div class="fd-job-head">${photo('fd-job-photo')}<div class="fd-job-copy"><span class="fd-eyebrow ${storageReady()?'fd-good':'fd-warn'}">${!storageReady()?(state.mode==='offline'?'Reconnecting':'Waiting for storage'):state.paused?'Current download continues':'Downloading'}</span><h3>${current.name}</h3><p class="fd-small fd-muted">720p · English · F1 LIVE</p></div></div><div class="fd-progress" role="progressbar" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100" aria-label="Download progress"><span style="width:42%"></span></div><div class="fd-job-foot"><span>42% complete</span>${button('Cancel','cancel:'+current.id,false,state.mode==='offline'?'disabled':'')}</div></article>`:''}<div class="fd-section-head"><h2>Up next</h2><span class="fd-small fd-muted">${state.paused?'Queue paused':'In download order'}</span></div>${waiting.length?waiting.map((j,i)=>`<div class="fd-list-row"><span class="fd-list-number">${i+1}</span><div class="fd-list-copy"><h3>${j.name}</h3><p class="fd-small fd-muted">${!storageReady()?(state.mode==='offline'?'Waiting for connection':'Waiting for storage'):'Queued'} · 720p · English</p></div><div class="fd-row-actions">${button(icon('arrow-up'),'up:'+j.id,false,`aria-label="Move ${escape(j.name)} up" ${i===0?'disabled':''}`)}${button('Remove','cancel:'+j.id)}</div></div>`).join(''):`<p class="fd-muted fd-small">No other sessions queued.</p>`}${failed.length?`<div class="fd-section-head"><h2>Needs attention</h2></div>${failed.map(j=>`<div class="fd-list-row"><div class="fd-list-copy"><h3>${j.name}</h3><p class="fd-small fd-warn">Connection interrupted. You can retry this replay.</p></div><div class="fd-row-actions">${button('Retry','retry:'+j.id,true,storageReady()?'':'disabled')}${button('Remove','cancel:'+j.id)}</div></div>`).join('')}`:''}`;}
    function downloads(){const list=state.library.filter(j=>j.name.toLowerCase().includes(state.librarySearch.toLowerCase()));return `${pageTitle('Downloads','One 720p MP4 per replay. Ready to watch or save.',button('Browse replays','browse'))}${!state.library.length?empty('Your library starts here','Downloaded replays will appear here, ready for your tablet.','browse','Find a replay','download'):`<div class="fd-toolbar"><label class="fd-search">${icon('search')}<input class="fd-input" type="search" id="fd-library-search" aria-label="Search downloads" placeholder="Search your downloads" value="${escape(state.librarySearch)}" data-search="library"></label><span class="fd-small fd-muted">${list.length} downloads</span></div><div class="fd-library">${list.map((j,i)=>`<article class="fd-session"><div class="fd-thumb">${photo('',i%2?'right center':'center',i)}<span class="fd-thumb-label">${j.duration}</span></div><div class="fd-card-body"><span class="fd-eyebrow fd-muted">${j.season} · ${j.type}</span><h3>${j.name}</h3><p class="fd-small fd-muted">720p · English · ${j.size}</p><div class="fd-card-footer">${button(icon('play')+' Watch','watch:'+j.id,true,storageReady()?'':'disabled')}${button(icon('download')+' Save MP4','save:'+j.id,false,storageReady()?'':'disabled')}${button(icon('trash-2'),'remove:'+j.id,false,`aria-label="Remove ${escape(j.name)}" ${storageReady()?'':'disabled'}`)}</div></div></article>`).join('')}</div>${!list.length?empty('No matching downloads','Try a different session name.','clear-library','Clear search','search'):''}`}`;}
    function watch(){const j=state.library.find(x=>x.id===state.watching)||state.library[0];if(!j)return `${pageTitle('Watch')}${empty('Nothing to play yet','Your downloaded replays will be available here.','browse','Find a replay','play')}`;return `<div class="fd-breadcrumb"><button data-go="downloads">Downloads</button><span>/ ${j.name}</span></div><div class="fd-player-layout"><section><div class="fd-player"><img class="fd-photo" src="${hero}" alt="Race playback poster"><button type="button" class="fd-play" data-action="play" aria-label="${state.playing?'Pause':'Play'} replay" ${storageReady()?'':'disabled'}>${icon(state.playing?'pause':'play')}</button><div class="fd-player-controls"><div class="fd-progress"><span style="width:14%"></span></div><div class="fd-player-time"><span>${icon('volume-2')}</span><span>18:32 / ${j.duration}</span><span>720p</span><span>${icon('maximize')}</span></div></div></div><div class="fd-watch-info"><div><h1>${j.name}</h1><p class="fd-small fd-muted" style="margin-top:7px">${j.season} · F1 LIVE · English · ${j.size}</p></div>${button(icon('download')+' Save MP4','save:'+j.id,true,storageReady()?'':'disabled')}</div><p class="fd-small fd-muted" style="margin-top:16px">Save the MP4 to watch offline in your device’s video player.</p></section><aside><h2>More from this weekend</h2>${['Qualifying','Practice 3','Practice 2'].map((name,i)=>`<button type="button" class="fd-next" data-go="weekend">${photo('','center',i+1)}<span><strong>${name}</strong><br><span class="fd-small fd-muted">View session</span></span></button>`).join('')}</aside></div>`;}
    function settings(){return `${pageTitle('Settings','Your F1TV account and media storage.')}<div class="fd-settings"><section class="fd-setting-panel"><h2>F1TV account</h2><div class="fd-account-state"><span class="fd-dot" style="${accountReady()?'':'background:var(--fd-amber)'}"></span><strong>${accountReady()?'Credentials saved':'Account not connected'}</strong></div><p class="fd-muted fd-small">${accountReady()?'Your saved login is kept securely. Account details are never displayed.':'Add your account to download available replays.'}</p>${state.editingAccount||!accountReady()?`<div class="fd-account-fields"><label class="fd-field">F1TV email<input class="fd-input" type="email" placeholder="Email address" disabled></label><label class="fd-field">Password<input class="fd-input" type="password" placeholder="Password" disabled></label></div><div class="fd-row-actions">${button('Save credentials','account-save',true,'disabled')}${accountReady()?button('Cancel','account-edit-cancel'):''}</div>`:`<div class="fd-row-actions">${button('Replace credentials','account-edit')}${button('Remove','account-remove')}</div>`}<div class="fd-section-head"><h2>Download format</h2></div><div class="fd-setting-line"><span>Resolution</span><strong>720p</strong></div><div class="fd-setting-line"><span>Feed</span><strong>F1 LIVE</strong></div><div class="fd-setting-line"><span>Audio</span><strong>English only</strong></div><div class="fd-setting-line"><span>File</span><strong>MP4</strong></div></section><section class="fd-setting-panel"><h2>Media storage</h2><div class="fd-account-state"><span class="fd-dot" style="${storageReady()?'':'background:var(--fd-amber)'}"></span><strong>${storageReady()?'Synology connected':'Waiting for Synology'}</strong></div><p class="fd-storage-name">Homelab-workspace / f1tv-dl</p>${storageReady()?`<div class="fd-setting-line"><span>Available space</span><strong>59 TB</strong></div><div class="fd-setting-line"><span>Downloads</span><strong>${state.library.length} files</strong></div>`:`<div class="fd-notice"><span>Downloads will resume when this storage is available.</span></div>`}<p class="fd-small fd-muted" style="margin-top:16px">Media is saved to Synology. Your account and queue stay on the server.</p>${button('Check connection','check-storage')}</section></div>`;}
    function render(focusId){
      root.dataset.appearance=prefs.appearance;root.dataset.photo=prefs.photoTreatment;root.style.setProperty('--fv-radius',prefs.cornerStyle==='Soft'?'10px':'6px');root.querySelectorAll('[data-appearance-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.appearanceChoice===prefs.appearance)));
      stage.dataset.device=state.device;stage.dataset.density=prefs.density;stage.dataset.media=prefs.media;stage.style.setProperty('--fd-hero',prefs.heroHeight+'px');
      root.querySelector('.fd-screen-picker').innerHTML=screens.map(([id,label])=>`<button type="button" data-screen-choice="${id}" aria-pressed="${state.screen===id}">${label}</button>`).join('');
      root.querySelectorAll('[data-device-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.deviceChoice===state.device)));
      root.querySelector('#fd-state').value=state.mode;
      let content='';
      if(state.mode==='loading')content=`${pageTitle(screens.find(x=>x[0]===state.screen)[1])}<div class="fd-loading" aria-busy="true" aria-label="Loading replay content"><div class="fd-skeleton"></div><div class="fd-skeleton"></div><div class="fd-skeleton"></div></div><p class="fd-muted fd-small" style="margin-top:18px">Loading replays…</p>`;
      else if(state.mode==='catalog-error'&&['browse','weekend'].includes(state.screen))content=`${pageTitle('Browse replays')}${empty('The replay catalog could not load','Your queue and downloaded files are still available.','refresh','Try again','wifi-off')}`;
      else content=({browse,weekend,queue,downloads,watch,settings}[state.screen])();
      app.innerHTML=`<div class="fd-window"><header class="fd-app-header"><button type="button" class="fd-brand" data-go="browse" aria-label="F1TV Downloads home"><span class="fd-brand-mark">F1</span><span>TV DOWNLOADS</span></button><nav class="fd-top-nav" aria-label="App navigation">${nav()}</nav><span class="fd-online"><span class="fd-dot" style="${storageReady()?'':'background:var(--fd-amber)'}"></span><span>${state.mode==='offline'?'Reconnecting':state.mode==='storage'?'Storage offline':'Connected'}</span></span></header>${notice()}<main class="fd-main">${content}</main>${state.toast?`<div class="fd-toast" role="status">${escape(state.toast)}</div>`:''}<footer class="fd-app-footer"><span>720p · English · F1 LIVE</span><span>${storageReady()?'Saved to Synology':'Waiting for media storage'}</span></footer><nav class="fd-mobile-nav" aria-label="Mobile app navigation">${nav(true)}</nav></div>`;
      if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
      if(focusId){const field=root.querySelector('#'+focusId);if(field){field.focus();const n=field.value.length;field.setSelectionRange(n,n);}}
    }
    function go(screen){state.screen=screen;state.toast='';if(screen==='weekend'&&!rounds.some(r=>r.id===state.round))state.round='sao';render();remember();setTimeout(()=>root.scrollIntoView({block:'start',behavior:'instant'}),0);}
    function confirm(title,copy,label,action){root.querySelector('#fd-dialog').style.width=state.device==='mobile'?'340px':'420px';root.querySelector('#fd-dialog-title').textContent=title;root.querySelector('#fd-dialog-content').innerHTML=copy;root.querySelector('#fd-dialog-confirm').textContent=label;dialogAction=action;root.querySelector('#fd-dialog').showModal();}
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.hasAttribute('data-close-dialog')){root.querySelector('#fd-dialog').close();return;}
      if(b.id==='fd-dialog-confirm'){root.querySelector('#fd-dialog').close();dialogAction?.();render();return;}
      if(b.dataset.appearanceChoice){prefs.appearance=b.dataset.appearanceChoice;render();remember();return;}
      if(b.dataset.deviceChoice){state.device=b.dataset.deviceChoice;render();remember();return;}
      if(b.dataset.screenChoice){go(b.dataset.screenChoice);return;}
      if(b.dataset.go){go(b.dataset.go);return;}
      if(b.dataset.round){state.round=b.dataset.round;state.sessionType='All';go('weekend');return;}
      if(b.dataset.sessionType){state.sessionType=b.dataset.sessionType;render();return;}
      if(!b.dataset.action)return;
      const [action,id]=b.dataset.action.split(':');
      if(screens.some(s=>s[0]===action)&&(action!=='queue'||!id)){if(action==='watch')state.watching=id||'race';go(action);return;}
      if(action==='latest'){state.round='sao';state.sessionType='All';go('weekend');return;}
      if(action==='queue'){const session=sessions.find(s=>s.id===id);const round=rounds.find(r=>r.id===state.round);state.jobs.push({id,name:`${round.name} · ${session.name}`,status:'queued'});state.toast=`${session.name} added to the queue.`;}
      if(action==='pause'){state.paused=!state.paused;state.toast=state.paused?'Queue paused. The current download can finish.':'Queue resumed.';}
      if(action==='retry'){const j=state.jobs.find(j=>j.id===id);j.status='queued';state.toast='Replay queued for another attempt.';}
      if(action==='up'){const index=state.jobs.findIndex(j=>j.id===id);const previous=state.jobs.slice(0,index).findLastIndex(j=>j.status==='queued');if(previous>=0)[state.jobs[index],state.jobs[previous]]=[state.jobs[previous],state.jobs[index]];}
      if(action==='cancel'){const j=state.jobs.find(j=>j.id===id);confirm(j.status==='running'?'Cancel this download?':'Remove this job?',`<p>${escape(j.name)}</p><p>${j.status==='running'?'The download will stop and its unfinished file will be removed.':'The session will be removed from the queue.'}</p>`,j.status==='running'?'Cancel download':'Remove job',()=>{state.jobs=state.jobs.filter(x=>x.id!==id);state.toast='Job removed from the queue.';});return;}
      if(action==='remove'){const j=state.library.find(j=>j.id===id);confirm('Remove this replay?',`<p>${escape(j.name)}</p><p>The MP4 will be deleted from Synology and removed from Downloads.</p>`,'Remove replay',()=>{state.library=state.library.filter(x=>x.id!==id);state.toast='Replay removed from Downloads.';});return;}
      if(action==='save')state.toast='Preview: this action saves the replay’s MP4 to your device.';
      if(action==='play')state.playing=!state.playing;
      if(action==='refresh'){state.mode='populated';state.toast='Example catalog refreshed.';}
      if(action==='clear-search')state.search='';
      if(action==='clear-library')state.librarySearch='';
      if(action==='all-sessions')state.sessionType='All';
      if(action==='account-edit')state.editingAccount=true;
      if(action==='account-edit-cancel')state.editingAccount=false;
      if(action==='account-remove'){confirm('Remove saved credentials?','<p>You can continue browsing. New downloads will need your F1TV account again.</p>','Remove credentials',()=>{state.mode='account';state.editingAccount=true;});return;}
      if(action==='check-storage'){state.toast=storageReady()?'Example: Synology connection is healthy.':'Example: still waiting for Synology. Your queue is saved.';}
      render();
    });
    root.addEventListener('change',e=>{
      if(e.target.id==='fd-state'){state.mode=e.target.value;state.toast='';state.editingAccount=false;if(state.mode==='fresh'){state.jobs=[];state.library=[];}else if(state.mode==='populated'){state.jobs=exampleQueue();state.library=exampleLibrary();}render();remember();return;}
      if(e.target.dataset.field){state[e.target.dataset.field]=e.target.value;render();}
    });
    root.addEventListener('input',e=>{if(e.target.dataset.search){if(e.target.dataset.search==='browse')state.search=e.target.value;else state.librarySearch=e.target.value;render(e.target.id);}});
    const saved=window.openai?.widgetState?.privateContent;
    if(saved?.stylePreview){if(['Dark','Light'].includes(saved.appearance))prefs.appearance=saved.appearance;if(['Natural','Cinematic'].includes(saved.photoTreatment))prefs.photoTreatment=saved.photoTreatment;if(['Precise','Soft'].includes(saved.cornerStyle))prefs.cornerStyle=saved.cornerStyle;if(screens.some(s=>s[0]===saved.screen))state.screen=saved.screen;if(['desktop','mobile'].includes(saved.device))state.device=saved.device;}
    window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s?.stylePreview){if(['Dark','Light'].includes(s.appearance))prefs.appearance=s.appearance;if(['Natural','Cinematic'].includes(s.photoTreatment))prefs.photoTreatment=s.photoTreatment;if(['Precise','Soft'].includes(s.cornerStyle))prefs.cornerStyle=s.cornerStyle;if(screens.some(v=>v[0]===s.screen))state.screen=s.screen;if(['desktop','mobile'].includes(s.device))state.device=s.device;render();}});
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:stage,onChange:()=>{render();remember();}});tweak.addSelect(prefs,'photoTreatment',{label:'Photo treatment',options:['Natural','Cinematic']});tweak.addSelect(prefs,'cornerStyle',{label:'Surface corners',options:['Precise','Soft']});}
  })();
  </script>
</div>
