name: f1tv-dl-webui

services:
  app:
    image: ${APP_IMAGE:-f1tv-dl-webui:local}
    build:
      context: .
      args:
        DRONE_COMMIT: ${TAG:-development}
    container_name: ${APP_CONTAINER_NAME:-f1tv-dl-webui}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-43729}:43729"
    environment:
      TZ: ${TZ:-UTC}
      HOST: 0.0.0.0
      PORT: "43729"
      DATA_DIR: /app/data
      DOWNLOAD_DIR: /app/downloads
      REQUIRE_NFS: ${REQUIRE_NFS:-false}
      STORAGE_ID: ${STORAGE_ID:-f1tv-dl-media-v1}
      STORAGE_LABEL: ${STORAGE_LABEL:-Media storage}
      STORAGE_MIN_FREE_BYTES: ${STORAGE_MIN_FREE_BYTES:-2000000000}
      DOWNLOAD_INACTIVITY_TIMEOUT_MS: ${DOWNLOAD_INACTIVITY_TIMEOUT_MS:-300000}
      DRONE_COMMIT: ${TAG:-development}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    volumes:
      - ${DATA_PATH:-data}:/app/data
      - ${DOWNLOAD_PATH:-media}:/app/downloads:${DOWNLOAD_MOUNT_OPTIONS:-rw}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    shm_size: 512mb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:43729/api/health').then(async response=>{const body=await response.json();if(!response.ok||!body.ok||body.commit!==process.env.DRONE_COMMIT||!body.storage.writable)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 20s

volumes:
  data:
  media:
    name: ${MEDIA_VOLUME_NAME:-f1tv-dl-media}
    driver: local
    driver_opts:
      type: ${MEDIA_TYPE:-}
      o: ${MEDIA_OPTIONS:-}
      device: ${MEDIA_DEVICE:-}
